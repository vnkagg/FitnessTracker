<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fat to Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fat to Fit Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky title bar, fixed bottom tabs, bottom sheets for every entry form.
   Colour language borrows from bumper plates: red = gym, blue = cardio, yellow = body, green = food. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F3F5F8; --line:#DCE1E8; --ink:#12161C; --ink-2:#465061; --muted:#768194;
  --red:#D63A2A; --blue:#2360C4; --yellow:#C99208; --green:#1F8549;
  --red-soft:#FBE6E2; --blue-soft:#E2EBFA; --yellow-soft:#FAF0D2; --green-soft:#DDF1E4;
  --on-accent:#FFFFFF; --on-yellow:#1C1503;
  --shadow:0 1px 2px rgba(18,28,45,.06),0 6px 18px rgba(18,28,45,.06);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1014; --surface:#161A20; --surface-2:#1D222A; --line:#2A313B; --ink:#EDF0F4; --ink-2:#B5BECB; --muted:#8590A0;
  --red:#F0604F; --blue:#5D93EE; --yellow:#EDBE3C; --green:#3DBA72;
  --red-soft:#3A1C19; --blue-soft:#18253D; --yellow-soft:#382D11; --green-soft:#132D1D;
  --on-accent:#FFFFFF; --on-yellow:#1C1503; --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#161A20; --surface-2:#1D222A; --line:#2A313B; --ink:#EDF0F4; --ink-2:#B5BECB; --muted:#8590A0;
  --red:#F0604F; --blue:#5D93EE; --yellow:#EDBE3C; --green:#3DBA72;
  --red-soft:#3A1C19; --blue-soft:#18253D; --yellow-soft:#382D11; --green-soft:#132D1D;
  --on-accent:#FFFFFF; --on-yellow:#1C1503; --shadow:0 1px 0 rgba(255,255,255,.03); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:16px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-family:var(--display);font-weight:700;font-size:36px;line-height:.95;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.store-pill{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.store-pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.store-pill.ok i{background:var(--green)}
#main{display:flex;flex-direction:column;gap:18px}
section > h2,.h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:13px;font-weight:600;font-size:16px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--red);color:var(--on-accent);border-color:transparent}
.btn.blue{background:var(--blue);color:var(--on-accent);border-color:transparent}
.btn.green{background:var(--green);color:var(--on-accent);border-color:transparent}
.btn.yellow{background:var(--yellow);color:var(--on-yellow);border-color:transparent}
.btn.ink{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.big{min-height:56px;font-size:18px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{min-height:32px;font-size:14px;padding:0 11px}
.ic{flex:none;display:block}
.ib{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.ib.on{background:var(--ink);color:var(--bg)}
.ib:disabled{opacity:.35}
/* plate badge */
.plate{--c:var(--red);width:38px;height:38px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--surface) 0 4px,var(--c) 5px 15px,color-mix(in srgb,var(--c) 80%,#000) 15.5px 16.5px,var(--c) 17px);display:inline-block}
.plate.blue{--c:var(--blue)} .plate.yellow{--c:var(--yellow)} .plate.green{--c:var(--green)}
.plate.sm{width:26px;height:26px;background:radial-gradient(circle,var(--surface) 0 3px,var(--c) 3.5px)}
/* start card */
.start h3{font-family:var(--display);font-size:30px;line-height:1;margin:0;text-transform:uppercase}
.start p{margin:4px 0 14px}
.start .chips{margin-bottom:14px}
/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:116px;min-width:0}
.tile b{font-family:var(--display);font-size:19px;text-transform:uppercase;line-height:1}
.tile span{font-size:13px;color:var(--muted);line-height:1.25}
.tile .v{font-family:var(--display);font-size:18px;color:var(--ink);font-weight:600}
/* session */
.sess-head{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:18px;padding:14px 16px}
.sess-head .clock{font-family:var(--display);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sess-head .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.sess-head .btn{background:var(--red);color:#fff;border:0}
.sess-stats{display:flex;gap:16px;padding:8px 4px 0;font-size:14px;color:var(--ink-2)}
.sess-stats b{font-family:var(--display);font-size:18px;color:var(--ink)}
.ecard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.ecard-h{display:flex;gap:12px;padding:14px 14px 8px;align-items:center}
.thumb{width:52px;height:52px;border-radius:13px;object-fit:cover;background:var(--red-soft);color:var(--red);flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ename{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.02;text-transform:uppercase;overflow-wrap:anywhere}
.emeta{font-size:13px;color:var(--muted);margin-top:2px}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.yel{background:var(--yellow-soft);color:var(--ink)}
.setting{display:flex;align-items:center;gap:8px;padding:0 14px 10px;flex-wrap:wrap}
.setting label{font-size:13px;font-weight:600;color:var(--ink-2)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface-2)}
.stepper button{width:38px;height:36px;display:grid;place-items:center;color:var(--ink-2);font-size:20px}
.stepper input{width:54px;height:36px;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:20px;font-weight:700}
.stepper input:focus{outline:none;background:var(--surface)}
.last-hint{font-size:12px;color:var(--muted)}
.ref{margin:0 14px 10px;padding:9px 11px;background:var(--surface-2);border-radius:11px;font-size:14px;color:var(--ink-2)}
.ref .eyebrow{font-size:11px;margin-bottom:2px}
.ref .num{font-size:17px;color:var(--ink-2)}
.sets{list-style:none;margin:0;padding:0 14px}
.sets li{display:grid;grid-template-columns:30px 1fr auto auto 34px;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.sets li:first-child{border-top:0}
.sets .n{font-family:var(--display);font-weight:700;color:var(--muted);font-size:16px}
.sets .wr{font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.sets .wr small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.sets .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.sets .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.del{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.del.armed{background:var(--red);color:#fff;width:auto;padding:0 8px;font-size:12px;font-weight:700}
.composer{border-top:1px dashed var(--line);margin-top:6px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.comp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.comp-top b{font-family:var(--display);font-size:17px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wrin{display:grid;grid-template-columns:1fr 18px 1fr;gap:6px;align-items:end}
.wrin .x{text-align:center;font-family:var(--display);font-size:22px;color:var(--muted);padding-bottom:14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big-in{width:100%;height:58px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface-2);text-align:center;font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.big-in::placeholder{color:var(--muted);opacity:.45}
.big-in:focus{outline:none;border-color:var(--red);background:var(--surface)}
.drop-row{display:grid;grid-template-columns:auto 1fr 14px 1fr 34px;gap:6px;align-items:center}
.drop-row .lbl{font-size:12px;font-weight:700;color:var(--red);letter-spacing:.06em;text-transform:uppercase}
.drop-row input{height:44px;font-size:22px}
.act-row{display:flex;gap:10px;align-items:stretch}
.timer{min-width:112px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.run{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timer.has{border-color:var(--ink-2)}
.act-row .btn{flex:1}
.efoot{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.efoot .btn{margin-left:auto}
.enote{padding:0 14px 12px}
.enote input,.tin{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px}
.enote input:focus,.tin:focus{outline:none;border-color:var(--ink-2);background:var(--surface)}
.enote .chips{margin-top:8px}
.photo-strip{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto}
.photo-strip img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.ss-join{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--blue);font-size:13px;font-weight:600;margin:-8px 0}
.ss-join i{height:18px;width:2px;background:var(--blue);display:block}
.add-ex{width:100%;min-height:64px;border:2px dashed var(--line);border-radius:18px;color:var(--ink-2);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;background:transparent}
.done-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.done-row .nm{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;line-height:1.05}
.done-row .sm{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.done-row .tm{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
/* food */
.macro{display:grid;gap:10px}
.kcal-big{display:flex;align-items:baseline;gap:8px}
.kcal-big b{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.over i{background:var(--red)}
.mrow{display:grid;grid-template-columns:64px 1fr 92px;gap:10px;align-items:center;font-size:14px}
.mrow .r{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .mini{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.item .val{font-family:var(--display);font-size:19px;font-weight:600;text-align:right;white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
.sheet-in{max-width:560px;width:100%;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;min-height:0;max-height:100%}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h3{font-family:var(--display);font-size:26px;text-transform:uppercase;margin:0;flex:1;line-height:1}
.sheet-b{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fin{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:20px;font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.fin:focus,textarea:focus{outline:none;border-color:var(--ink-2);background:var(--surface)}
textarea{width:100%;min-height:80px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:10px 12px;font-size:16px;resize:vertical}
.computed{padding:12px 14px;border-radius:12px;background:var(--blue-soft);display:flex;justify-content:space-between;gap:10px;font-size:14px}
.computed b{font-family:var(--display);font-size:22px}
.photo-box{display:flex;gap:10px;align-items:center}
.photo-box img{width:84px;height:84px;border-radius:12px;object-fit:cover}
.photo-add{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:12px;border:1.5px dashed var(--line);color:var(--ink-2);font-weight:600;width:100%}
.pick-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);width:100%;text-align:left}
.pick-item:first-child{border-top:0}
.pick-item .thumb{width:42px;height:42px;font-size:18px;border-radius:10px}
.pick-item b{font-family:var(--display);font-size:20px;text-transform:uppercase;display:block;line-height:1.05}
.pick-item span{font-size:13px;color:var(--muted)}
.search{position:relative}
.search input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 14px 0 42px;font-size:18px}
.search input:focus{outline:none;border-color:var(--red);background:var(--surface)}
.search .ic{position:absolute;left:13px;top:16px;color:var(--muted)}
.create{padding:14px;border-radius:14px;background:var(--red-soft);display:flex;flex-direction:column;gap:10px}
.viewer img{width:100%;border-radius:14px}
/* history */
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto}
.cal i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--surface-2);display:block;min-width:14px;max-width:100%}
.cal i.g{background:var(--red)} .cal i.c{background:var(--blue)} .cal i.gc{background:linear-gradient(135deg,var(--red) 50%,var(--blue) 50%)}
.cal i.today{outline:2px solid var(--ink);outline-offset:1px}
.cal i.fut{opacity:.35}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.day{display:flex;flex-direction:column;gap:8px}
.day-h{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.day-h b{font-family:var(--display);font-size:20px;text-transform:uppercase}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);text-align:left;width:100%}
.hrow .tt{font-weight:600}
.hrow .ss{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hrow .mini{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}
.hdetail{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.hdetail .hrow{box-shadow:none;border-radius:0}
.hx{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.hx-e .nm{font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase}
.hx-e .ln{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;gap:10px;padding:3px 0;border-top:1px dashed var(--line)}
.hx-e .ln:first-of-type{border-top:0}
/* progress */
.journey{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px}
.journey .eyebrow{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.jnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.jnums b{font-family:var(--display);font-size:30px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.jnums span{font-size:12px;color:color-mix(in srgb,var(--bg) 65%,transparent)}
.jbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 18%,transparent);overflow:hidden}
.jbar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:13px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{min-height:40px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px;min-width:0}
.stat b{font-family:var(--display);font-size:24px;display:block;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted);line-height:1.2;display:block;margin-top:3px}
.chart-card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 10px 10px}
.chart-card .ct{padding:0 6px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart-card .ct b{font-family:var(--display);font-size:18px;text-transform:uppercase}
.chart-card .ct span{font-size:12px;color:var(--muted)}
.chart-box{position:relative;height:250px}
select.sel{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:17px;font-weight:600}
.empty{text-align:center;padding:28px 18px;color:var(--ink-2)}
.empty b{font-family:var(--display);font-size:22px;text-transform:uppercase;display:block;color:var(--ink);margin-bottom:6px}
/* more */
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.lrow:first-child{border-top:0}
.lrow .thumb{width:40px;height:40px;font-size:17px;border-radius:10px}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-bar{background:var(--yellow);color:var(--on-yellow);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.demo-bar button{margin-left:auto;background:rgba(0,0,0,.12);border-radius:9px;padding:6px 10px;font-weight:700}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
nav.tabs .live{position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){#sheet,#scrim,#toast{transition:none}}
@media (max-width:370px){.tiles{grid-template-columns:1fr 1fr 1fr}.tile{padding:10px}.top h1{font-size:30px}}

<body>
<div class="app">
  <header class="top">
    <div><div class="eyebrow" id="top-eyebrow"></div><h1 id="top-title">Today</h1></div>
    <div class="store-pill" id="store-pill"><i></i><span>Connecting…</span></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script src="vendor/chart.umd.min.js"></script>
<script>
/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const DAY = 864e5;
const pad = n => String(n).padStart(2, '0');
const dkey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const hm = (t = Date.now()) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const keyDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDay = k => keyDate(k).toLocaleDateString([], {weekday: 'short', day: 'numeric', month: 'short'});
const fmtShort = t => new Date(t).toLocaleDateString([], {day: 'numeric', month: 'short'});
const fmtDur = sec => { sec = Math.max(0, Math.round(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const num = v => { if (v == null || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtN = (v, d = 1) => v == null ? '—' : (Math.round(v * 10 ** d) / 10 ** d).toLocaleString();
const fmtW = w => (w == null || w === 0) ? 'BW' : (Math.round(w * 100) / 100).toString();
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const PH = {}; const phLoading = new Set();
function photoSrc(p) {
  if (!p) return '';
  if (/^(data|blob):/.test(p) || p.startsWith('data/')) return p;
  if (p.startsWith('idb:')) { if (PH[p]) return PH[p]; loadPhoto(p); return BLANK; }
  return '/_blob/' + p;
}
async function loadPhoto(p) {
  if (phLoading.has(p) || !IDB.db) return; phLoading.add(p);
  try { const b = await IDB.get('photos', p.slice(4)); if (b) { PH[p] = URL.createObjectURL(b); changed(); const a = document.activeElement; if (S.sheet && !(a && a.closest && a.closest('#sheet') && /INPUT|TEXTAREA/.test(a.tagName))) renderSheet(); } } catch (e) {}
}
/* IndexedDB: the on-phone store used when the page runs outside Claude (e.g. GitHub Pages) */
const IDB = {
  db: null,
  open() { return new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error('no indexedDB')); const r = indexedDB.open('fat-to-fit', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
    r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  run(store, mode, fn) { return new Promise((res, rej) => { const tx = this.db.transaction(store, mode); const r = fn(tx.objectStore(store)); tx.oncomplete = () => res(r ? r.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); },
  get(store, k) { return this.run(store, 'readonly', s => s.get(k)); },
  put(store, k, v) { return this.run(store, 'readwrite', s => s.put(v, k)); },
  keys(store) { return this.run(store, 'readonly', s => s.getAllKeys()); }
};
const I = {
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  play:'<path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor" stroke="none"/>',
  stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/>',
  cam:'<path d="M4 8.5h3.2L9 5.8h6l1.8 2.7H20V19H4z"/><circle cx="12" cy="13.3" r="3.4"/>',
  up:'<path d="M6 15l6-6 6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
  today:'<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  history:'<path d="M4 12a8 8 0 1 0 2.3-5.6L4 8.7"/><path d="M4 4v4.7h4.7"/><path d="M12 8v4l3 2"/>',
  chart:'<path d="M4 19h16"/><path d="M6 15l4-5 3 3 5-7"/>',
  more:'<circle cx="5.5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  redo:'<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/>',
  drop:'<path d="M12 4v12M7 11l5 5 5-5M6 20h12"/>',
  edit:'<path d="M5 19h4L19 9l-4-4L5 15z"/>'
};
const icon = (n, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ============ constants ============ */
const DEF = { kcal: 2000, protein: 150, carbs: 200, fat: 60, goalWeight: null,
  splits: ['Push', 'Pull', 'Legs', 'Chest + Tri', 'Back + Bi', 'Shoulders', 'Arms + Forearms', 'Full body'] };
const MUSCLES = ['Chest', 'Back', 'Legs', 'Shoulders', 'Traps', 'Biceps', 'Triceps', 'Forearms', 'Core', 'Glutes', 'Calves', 'Full body'];
const SET_TAGS = ['Warm-up', 'Cheat reps', 'Spotted', 'To failure', 'Partial'];
const ENTRY_NOTES = ['Easy today', 'Felt hard', 'Fatigued', 'Felt strong', 'Form check'];
const CARDIO = ['Treadmill', 'Incline walk', 'Elliptical', 'Cycle', 'Stair climber', 'Rower', 'Outdoor run', 'Walk'];
const MEALS = ['Breakfast', 'Lunch', 'Snack', 'Dinner'];
const FEELS = ['Great', 'Good', 'Okay', 'Tired', 'Rough'];
const COLS = ['gym', 'cardio', 'body', 'food', 'exercises', 'meta'];
const emptyData = () => Object.fromEntries(COLS.map(c => [c, {}]));

/* ============ storage ============ */
const Store = {
  mode: 'connecting', db: null, assets: null, downloads: null, demo: false,
  real: emptyData(), demoData: null, queues: {},
  get data() { return this.demo ? this.demoData : this.real; },
  async start() {
    const fallback = async () => { if (this.mode !== 'connecting') return; this.mode = 'local'; await this.loadLocal(); changed(); await applySeed(); };
    if (!window.claude || !window.claude.use) { fallback(); return; }
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { fallback(); return; }
    this.db = db; this.mode = 'db';
    try { this.assets = await window.claude.use('assets'); } catch (e) {}
    try { this.downloads = await window.claude.use('downloads'); } catch (e) {}
    COLS.forEach(c => this.subscribe(c));
    changed();
  },
  subscribe(col) {
    this.db.collection(col).onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { if (d.exists) m[d.id] = clone(d.data()); });
      // keep optimistic values for docs with a queued write
      Object.keys(this.queues).forEach(p => { const [c, id] = p.split('/'); const q = this.queues[p]; if (c === col && q.busy && q.local !== undefined) { if (q.local === null) delete m[id]; else m[id] = q.local; } });
      this.real[col] = m; this.loaded = true; changed();
    }, err => { toast('Sync stopped: ' + (err.code || 'error') + '. Reload to reconnect.'); if (err.code === 'unavailable') setTimeout(() => this.subscribe(col), 3000); });
  },
  idb: false, localQ: Promise.resolve(),
  async loadLocal() {
    try {
      await IDB.open(); this.idb = true;
      for (const c of COLS) this.real[c] = (await IDB.get('kv', c)) || {};
      if (!COLS.some(c => Object.keys(this.real[c]).length)) COLS.forEach(c => { try { const v = JSON.parse(localStorage.getItem('ftf:' + c) || '{}'); if (Object.keys(v).length) { this.real[c] = v; this.saveLocal(c); } } catch (e) {} });
    } catch (e) {
      this.idb = false;
      COLS.forEach(c => { try { this.real[c] = JSON.parse(localStorage.getItem('ftf:' + c) || '{}'); } catch (e2) { this.real[c] = {}; } });
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  },
  saveLocal(col) {
    if (this.idb) { this.localQ = this.localQ.then(() => IDB.put('kv', col, this.real[col])).catch(() => toast('Could not save on this phone. Is storage full?')); return; }
    try { localStorage.setItem('ftf:' + col, JSON.stringify(this.real[col])); }
    catch (e) { toast('This device ran out of space. Remove some photos.'); }
  },
  put(col, id, obj) {
    obj = clone(obj);
    this.data[col][id] = obj; changed();
    if (this.demo) return;
    if (this.mode === 'db') this.enqueue(col, id, obj); else this.saveLocal(col);
  },
  del(col, id) {
    delete this.data[col][id]; changed();
    if (this.demo) return;
    if (this.mode === 'db') this.enqueue(col, id, null); else this.saveLocal(col);
  },
  enqueue(col, id, obj) {
    const p = col + '/' + id;
    const q = this.queues[p] || (this.queues[p] = { busy: false, next: undefined, local: undefined });
    q.next = obj; q.local = obj;
    if (!q.busy) this.drain(p);
  },
  async drain(p) {
    const q = this.queues[p]; q.busy = true;
    const ref = this.db.doc(p);
    while (q.next !== undefined) {
      const val = q.next; q.next = undefined;
      const run = () => val === null ? ref.delete() : ref.set(val);
      try { await run(); }
      catch (e) {
        if (e && (e.code === 'unavailable')) { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); try { await run(); continue; } catch (e2) { e = e2; } }
        toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Delete old photos or entries.' : 'Could not save (' + ((e && e.code) || 'error') + ')');
      }
    }
    q.busy = false; q.local = undefined;
  }
};
const D = () => Store.data;
const settings = () => Object.assign({}, DEF, (D().meta.settings) || {});

/* ============ app state ============ */
const S = {
  tab: 'today', ui: { split: null, hist: 'all', histLimit: 14, open: {}, seg: 'body', bodyM: 'weight', cardioM: 'pace', cardioT: null, foodM: 'kcal', strM: 'top', range: 90, pex: null, confirm: null },
  drafts: {}, sheet: null, form: {}, charts: []
};
try { S.drafts = JSON.parse(localStorage.getItem('ftf-drafts') || '{}'); } catch (e) {}
const saveDrafts = () => { try { localStorage.setItem('ftf-drafts', JSON.stringify(S.drafts)); } catch (e) {} };
const draft = eid => S.drafts[eid] || (S.drafts[eid] = { w: '', reps: '', drops: [], tags: [], tStart: null, dur: null });

let renderQueued = false;
function changed() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

/* ============ derived data ============ */
const sessions = () => Object.values(D().gym).sort((a, b) => b.startedAt - a.startedAt);
const activeSession = () => sessions().find(s => !s.endedAt);
const isWarm = st => (st.tags || []).includes('Warm-up');
const setVol = st => (st.w || 0) * (st.reps || 0) + sum((st.drops || []).map(d => (d.w || 0) * (d.reps || 0)));
const entryVol = e => sum((e.sets || []).filter(s => !isWarm(s)).map(setVol));
const sessVol = s => sum((s.entries || []).map(entryVol));
const sessSets = s => sum((s.entries || []).map(e => (e.sets || []).length));
const tagCls = t => t === 'Warm-up' ? 'yel' : ['Cheat reps', 'To failure', 'Partial', 'Spotted'].includes(t) ? 'red' : '';
const setStr = st => `${fmtW(st.w)}×${st.reps}` + (st.drops || []).map(d => ` → ${fmtW(d.w)}×${d.reps}`).join('');
const e1rm = st => (st.w || 0) * (1 + Math.min(st.reps || 0, 15) / 30);
function lastPerf(exId, excludeSid) {
  for (const s of sessions()) {
    if (s.id === excludeSid) continue;
    const es = (s.entries || []).filter(e => e.exId === exId && (e.sets || []).length);
    if (es.length) return { session: s, entry: es[es.length - 1] };
  }
  return null;
}
function exUsage() {
  const u = {};
  sessions().forEach(s => (s.entries || []).forEach(e => {
    const x = u[e.exId] || (u[e.exId] = { n: 0, last: 0, splits: {} });
    x.n++; x.last = Math.max(x.last, s.startedAt); x.splits[s.split] = (x.splits[s.split] || 0) + 1;
  }));
  return u;
}
const foodTotals = day => { const it = (day && day.items) || []; return { kcal: sum(it.map(i => i.kcal)), p: sum(it.map(i => i.p)), c: sum(it.map(i => i.c)), f: sum(it.map(i => i.f)), n: it.length }; };
const bodySorted = () => Object.values(D().body).sort((a, b) => a.ts - b.ts);
const cardioSorted = () => Object.values(D().cardio).sort((a, b) => b.ts - a.ts);

/* ============ toast & confirm ============ */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function armed(key) { if (S.ui.confirm === key) { S.ui.confirm = null; return true; } S.ui.confirm = key; setTimeout(() => { if (S.ui.confirm === key) { S.ui.confirm = null; render(); if (S.sheet && !(document.activeElement && document.activeElement.closest('#sheet'))) renderSheet(); } }, 3500); return false; }
const isArmed = key => S.ui.confirm === key;

/* ============ render shell ============ */
const TABS = [['today', 'Today', 'today'], ['history', 'History', 'history'], ['progress', 'Progress', 'chart'], ['more', 'More', 'more']];
function renderNav() {
  const live = !!activeSession();
  $('#nav').innerHTML = TABS.map(([k, l, ic]) => `<button data-act="tab" data-id="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${icon(ic, 22)}${l}${k === 'today' && live ? '<span class="live" aria-label="session live"></span>' : ''}</button>`).join('');
  const titles = { today: 'Today', history: 'History', progress: 'Progress', more: 'Setup' };
  $('#top-title').textContent = titles[S.tab];
  $('#top-eyebrow').textContent = new Date().toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  const pill = $('#store-pill');
  const m = Store.demo ? ['Sample data', false] : Store.mode === 'db' ? ['Synced', true] : Store.mode === 'local' ? ['On this phone', true] : ['Loading…', false];
  pill.className = 'store-pill' + (m[1] ? ' ok' : ''); pill.querySelector('span').textContent = m[0];
}
function render(force) {
  const a = document.activeElement;
  if (!force && a && a.closest && a.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { S.dirty = true; renderNav(); return; }
  S.dirty = false;
  destroyCharts();
  const v = { today: viewToday, history: viewHistory, progress: viewProgress, more: viewMore }[S.tab];
  $('#main').innerHTML = (Store.demo ? `<div class="demo-bar">Viewing sample data. Nothing you do here is saved.<button data-act="demoOff">Exit</button></div>` : '') + v();
  renderNav();
  if (S.tab === 'progress') drawCharts();
  tick();
}

/* ============ TODAY ============ */
function viewToday() {
  const s = activeSession();
  let h = '';
  h += s ? viewSession(s) : startCard();
  h += quickTiles();
  h += todayFood();
  const today = dkey();
  const doneToday = sessions().filter(x => x.endedAt && x.date === today);
  if (doneToday.length) h += `<section><h2>Finished today</h2><div class="list">${doneToday.map(x => histGym(x)).join('')}</div></section>`;
  const cardio = cardioSorted().filter(c => c.date === today);
  const body = Object.values(D().body).filter(b => b.date === today).sort((a, b) => b.ts - a.ts);
  if (cardio.length || body.length) h += `<section><h2>Also today</h2><div class="list">${cardio.map(histCardio).join('')}${body.map(histBody).join('')}</div></section>`;
  return h;
}
function suggestedSplit() {
  const st = settings(); const lastDone = {};
  sessions().forEach(s => { if (s.endedAt && !(s.split in lastDone)) lastDone[s.split] = s.startedAt; });
  const rot = st.splits.slice(0, 5);
  return rot.slice().sort((a, b) => (lastDone[a] || 0) - (lastDone[b] || 0))[0] || st.splits[0];
}
function startCard() {
  const st = settings();

function calendar() {

  for (let i = 0; i < weeks * 7; i++) {

    cells += `<i class="${g && c ? 'gc' : g ? 'g' : c ? 'c' : ''} ${k === dkey() ? 'today' : ''} ${t > now.getTime() ? 'fut' : ''}" title="${fmtDay(k)}"></i>`;
  }
  const last28 = [...gymDays].filter(k => keyDate(k).getTime() > now.getTime() - 28 * DAY).length;
  return `<section class="card"><div class="row" style="margin-bottom:10px"><div class="grow"><div class="eyebrow">Last ${weeks} weeks</div></div><div class="ink2" style="font-size:14px"><b class="num" style="font-size:20px">${last28}</b> gym days in 4 weeks</div></div>

}
function viewHistory() {

  if (f === 'all' || f === 'gym') sessions().forEach(s => add(s.date, 'gym', s));
  if (f === 'all' || f === 'cardio') Object.values(D().cardio).forEach(c => add(c.date, 'cardio', c));

  if (f === 'all' || f === 'food') Object.values(D().food).forEach(d => { if ((d.items || []).length) add(d.date, 'food', d); });
  const keys = Object.keys(days).sort().reverse();

function pickImage() {

    inp.onchange = () => { res(inp.files[0] || null); inp.remove(); };

}
async function compress(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}

async function storePhoto(file) {
  try {

      const blob = await compress(file, 1400, .82);
      try { const r = await Store.assets.upload(blob, { type: 'image/jpeg' }); return r.id; }
      catch (e) { if (e && e.code === 'store_unavailable') { await new Promise(r => setTimeout(r, 800)); const r = await Store.assets.upload(blob, { type: 'image/jpeg' }); return r.id; } throw e; }
    }
    if (Store.mode === 'local' && Store.idb && !Store.demo) {
      const blob = await compress(file, 1400, .82); const id = uid();
      await IDB.put('photos', id, blob); const p = 'idb:' + id; PH[p] = URL.createObjectURL(blob); return p;
    }
    return await blobToDataURL(await compress(file, 640, .7));
  } catch (e) { toast('Photo not saved (' + ((e && e.code) || 'error') + ')'); return null; }
}

  histMore: () => { S.ui.histLimit += 14; render(true); },
  seg: id => { S.ui.seg = id; render(true); },
  range: id => { S.ui.range = +id; render(true); },
  bodyM: id => { S.ui.bodyM = id; render(true); },
  strM: id => { S.ui.strM = id; render(true); },
  cardioM: id => { S.ui.cardioM = id; render(true); },
  cardioT: id => { S.ui.cardioT = id; render(true); },
  foodM: id => { S.ui.foodM = id; render(true); },
  newEx: () => openSheet('exercise', { name: '', muscle: '', settingLabel: 'Machine setting', setting: '', note: '' }),
  editEx: id => openSheet('exercise', { ...D().exercises[id], setting: D().exercises[id].setting ?? '' }),
  saveEx: () => {
    const f = S.form; const name = (f.name || '').trim(); if (!name) { toast('Give it a name'); return; }
    const id = f.id || uid(); const prev = D().exercises[id] || {};
    Store.put('exercises', id, { ...prev, id, name, muscle: f.muscle || '', settingLabel: (f.settingLabel || '').trim() || 'Machine setting', setting: f.setting === '' ? null : f.setting, photo: f.photo || null, note: f.note || '', createdAt: prev.createdAt || Date.now() });
    closeSheet(); render(true); toast('Exercise saved');
  },
  delEx: () => { if (!armed('dx' + S.form.id)) return renderSheet(); Store.del('exercises', S.form.id); closeSheet(); render(true); },
  export: async () => {
    const name = `fat-to-fit-backup-${dkey()}.json`;
    const out = { app: 'fat-to-fit-journey', version: 1, exportedAt: new Date().toISOString(), data: Store.real, photos: {} };
    if (Store.idb) { try { toast('Preparing backup…'); for (const k of await IDB.keys('photos')) { const b = await IDB.get('photos', k); if (b) out.photos['idb:' + k] = await blobToDataURL(b); } } catch (e) {} }
    const json = JSON.stringify(out);
    if (Store.downloads) { try { await Store.downloads.save({ filename: name, data: json }); toast('Backup ready'); return; } catch (e) { if (e && e.code === 'declined') return; } }
    const blob = new Blob([json], { type: 'application/json' });
    try { const file = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Fat to Fit backup' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast('Backup saved'); }
    catch (e) { toast('Export is not available here'); }
  },
  demoOn: () => { Store.demoData = genDemo(); Store.demo = true; S.ui.pex = null; S.ui.cardioT = null; render(true); toast('Sample data loaded. Nothing is saved.'); },
  demoOff: () => { Store.demo = false; S.ui.pex = null; S.ui.cardioT = null; render(true); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.id, el);
});
$('#scrim').addEventListener('click', closeSheet);
const main = $('#main');
main.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.d) { draft(t.dataset.eid)[t.dataset.d] = t.value; saveDrafts(); }
  else if (t.dataset.dd) { const d = draft(t.dataset.eid); d.drops[+t.dataset.i][t.dataset.dd] = t.value; saveDrafts(); }
});
main.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.setting) { const v = t.value.trim(); updateSession(s => { findE(s, t.dataset.setting).setting = v === '' ? null : v; }); }
  else if (t.dataset.enote) { const v = t.value; updateSession(s => { findE(s, t.dataset.enote).note = v; }); }
  else if (t.dataset.sel === 'pex') { S.ui.pex = t.value; t.blur(); render(true); }
  else if (t.dataset.st) {
    const st = { ...(D().meta.settings || {}) }; const k = t.dataset.st;
    if (k === 'splits') { const arr = t.value.split(',').map(x => x.trim()).filter(Boolean); st.splits = arr.length ? arr : DEF.splits; }
    else { const v = num(t.value); st[k] = v == null ? (k === 'goalWeight' ? null : DEF[k]) : v; }
    Store.put('meta', 'settings', st); toast('Saved');
  }
  else if (t.id === 'imp' && t.files[0]) importFile(t.files[0]);
});
main.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (S.dirty && !(a && a.closest && a.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render(true); }, 60));
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.d === 'reps') { e.preventDefault(); A.logSet(e.target.dataset.eid); } else if (e.key === 'Enter' && e.target.dataset.d === 'w') { e.preventDefault(); const r = document.querySelector(`[data-d="reps"][data-eid="${e.target.dataset.eid}"]`); if (r) r.focus(); } });
const sheet = $('#sheet');
sheet.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.f) return;
  S.form[t.dataset.f] = t.value;
  if (S.sheet === 'picker' && t.dataset.f === 'q') $('#pick-list').innerHTML = pickerList();
  if (S.sheet === 'cardio' && ['min', 'sec', 'dist'].includes(t.dataset.f)) $('#pace-box').innerHTML = paceBox((num(S.form.min) || 0) * 60 + (num(S.form.sec) || 0), num(S.form.dist));
});
sheet.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pick-q') { e.preventDefault(); const first = $('#pick-list .pick-item:not([disabled])'); const q = (S.form.q || '').trim().toLowerCase(); const exact = Object.values(D().exercises).find(x => x.name.toLowerCase().trim() === q); if (exact) A.pickEx(exact.id); else if (q) A.createEx(); else if (first) first.click(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

async function importFile(file) {
  try {
    const obj = JSON.parse(await file.text()); const data = obj.data || obj;
    let n = 0;
    if (obj.photos && Store.idb && !Store.demo) for (const [k, url] of Object.entries(obj.photos)) { try { const b = await (await fetch(url)).blob(); await IDB.put('photos', k.replace(/^idb:/, ''), b); } catch (e) {} }
    for (const c of COLS) for (const [id, doc] of Object.entries(data[c] || {})) { if (Store.demo) continue; Store.put(c, id, doc); n++; if (Store.mode === 'db' && n % 20 === 0) await new Promise(r => setTimeout(r, 400)); }
    toast(`Imported ${n} records`);
  } catch (e) { toast('That file is not a valid backup'); }
}

/* ============ first-run import of past workouts (data/seed.json, only outside Claude) ============ */
async function applySeed() {
  if (Store.mode !== 'local') return;
  let seed; try { const r = await fetch('data/seed.json', { cache: 'no-cache' }); if (!r.ok) return; seed = await r.json(); } catch (e) { return; }
  if (!seed || !seed.version || !seed.data) return;
  let applied = null; try { applied = Store.idb ? await IDB.get('kv', 'seedApplied') : localStorage.getItem('ftf:seedApplied'); } catch (e) {}
  if (applied === seed.version) return;
  let n = 0;
  COLS.forEach(c => Object.entries(seed.data[c] || {}).forEach(([id, doc]) => { if (!Store.real[c][id]) { Store.real[c][id] = doc; if (c === 'gym') n++; } }));
  COLS.forEach(c => Store.saveLocal(c));
  try { if (Store.idb) await IDB.put('kv', 'seedApplied', seed.version); else localStorage.setItem('ftf:seedApplied', seed.version); } catch (e) {}
  changed(); if (n) toast(`Added ${n} past workouts from your WhatsApp log`);
}

/* ============ ticker ============ */
function tick() { const now = Date.now(); document.querySelectorAll('[data-since]').forEach(el => { el.textContent = fmtDur((now - Number(el.dataset.since)) / 1000); }); }
setInterval(tick, 1000);

/* ============ sample data ============ */
function genDemo() {
  let a = 7; const R = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rnd = (x, y) => x + R() * (y - x); const r25 = v => Math.round(v / 2.5) * 2.5;
  const data = emptyData(); data.meta.settings = { ...DEF, kcal: 2100, protein: 160, goalWeight: 78 };
  const lib = [['Chest press machine', 'Chest', 'Seat', 4, 35], ['Incline DB press', 'Chest', null, null, 16], ['Pec fly', 'Chest', 'Seat', 3, 30], ['Shoulder press machine', 'Shoulders', 'Seat', 5, 25], ['Lateral raise', 'Shoulders', null, null, 6], ['Rope pushdown', 'Triceps', 'Pin', 9, 20],
    ['Lat pulldown', 'Back', 'Thigh pad', 4, 45], ['Seated row', 'Back', 'Chest pad', 6, 40], ['DB curl', 'Biceps', null, null, 10], ['Hammer curl', 'Biceps', null, null, 10], ['Leg press', 'Legs', 'Seat', 7, 90], ['Leg extension', 'Legs', 'Back pad', 3, 35], ['Lying leg curl', 'Legs', 'Pad', 2, 30], ['Calf raise', 'Calves', null, null, 40]];
  const exIds = lib.map(([name, muscle, sl, set]) => { const id = 'demo' + uid(); data.exercises[id] = { id, name, muscle, settingLabel: sl || 'Machine setting', setting: set, photo: null, note: '', createdAt: 0 }; return id; });
  const plans = { Push: [0, 1, 2, 3, 4, 5], Pull: [6, 7, 8, 9], Legs: [10, 11, 12, 13] };
  const today0 = new Date(); today0.setHours(0, 0, 0, 0);
  const foods = [['Breakfast', 'Oats, whey, banana', 480, 38, 62, 9], ['Breakfast', 'Paneer bhurji + 2 roti', 520, 30, 44, 24], ['Lunch', 'Dal, rice, salad', 610, 22, 98, 12], ['Lunch', 'Chicken breast + rice', 640, 52, 70, 12], ['Snack', 'Greek yogurt + almonds', 260, 20, 14, 14], ['Snack', 'Whey shake', 130, 25, 3, 2], ['Dinner', 'Grilled fish + veg', 520, 45, 30, 20], ['Dinner', 'Rajma chawal', 620, 22, 100, 10]];
  let rot = 0;
  for (let d = 63; d >= 1; d--) {
    const day = today0.getTime() - d * DAY; const prog = (63 - d) / 63; const dow = new Date(day).getDay();
    if (dow !== 0 && R() < .75) {
      const split = ['Push', 'Pull', 'Legs'][rot++ % 3]; const start = day + (18 * 60 + rnd(0, 50)) * 60000; let t = start + 300000;
      const plan = plans[split].slice(0, 4 + (R() < .5 ? 1 : 0));
      const entries = plan.map(i => {
        const [name, muscle, sl, set, base] = lib[i]; const w0 = base * (1 + prog * .25); const sets = []; const n = 3 + (R() < .4 ? 1 : 0); const eStart = t;
        for (let k = 0; k < n; k++) {
          t += rnd(80, 140) * 1000; const w = r25(w0 * (k === 0 ? .7 : 1 + (k > 1 ? .05 : 0))); const reps = k === 0 ? 12 : Math.round(rnd(6, 11)); const dur = Math.round(rnd(25, 55));
          sets.push({ id: uid(), ts: t + dur * 1000, w, reps, drops: k === n - 1 && R() < .3 ? [{ w: r25(w * .7), reps: Math.round(rnd(5, 9)) }] : [], dur, tags: k === 0 ? ['Warm-up'] : (R() < .08 ? ['Cheat reps'] : []) }); t += dur * 1000;
        }
        t += 90000;
        return { id: uid(), exId: exIds[i], name, muscle, settingLabel: sl || 'Machine setting', setting: set, note: R() < .1 ? 'Felt hard' : '', photo: null, startedAt: eStart, doneAt: t, group: null, sets };
      });
      const id = 'demo' + uid(); data.gym[id] = { id, date: dkey(start), split, startedAt: start, endedAt: t + 60000, note: '', feel: FEELS[Math.floor(rnd(0, 3))], entries };
    }
    if (R() < .7) { const ts = day + 7.2 * 3600e3 + rnd(0, 3600e3); const dur = Math.round((36.2 - prog * 3.4 + rnd(-.7, .7)) * 60); const id = 'demo' + uid(); const hr = Math.round(158 - prog * 7 + rnd(-3, 3));
      data.cardio[id] = { id, date: dkey(ts), ts, type: 'Treadmill', dur, dist: 5, kcal: Math.round(rnd(380, 430)), avgHr: hr, maxHr: hr + Math.round(rnd(10, 18)), incline: 1, speed: Math.round(5 / (dur / 3600) * 10) / 10, note: '', photo: null }; }
    if (d % 3 === 0 || R() < .2) { const ts = day + 7 * 3600e3; const id = 'demo' + uid();
      data.body[id] = { id, date: dkey(ts), ts, weight: Math.round((91.8 - prog * 5.4 + rnd(-.35, .35)) * 10) / 10, bf: Math.round((31.4 - prog * 3.1 + rnd(-.3, .3)) * 10) / 10, muscle: Math.round((58.9 + prog * .9 + rnd(-.2, .2)) * 10) / 10, protein: Math.round((16.1 + prog * .8) * 10) / 10, water: Math.round((50.2 + prog * 1.6 + rnd(-.3, .3)) * 10) / 10, note: '', photo: null }; }
    if (R() < .85) { const k = dkey(day + 12 * 3600e3); const items = MEALS.map((m, mi) => { const opts = foods.filter(f => f[0] === m); const f = opts[Math.floor(R() * opts.length)]; const sc = rnd(.85, 1.2);
      return { id: uid(), ts: day + [8.5, 13.5, 17, 21][mi] * 3600e3, meal: m, name: f[1], kcal: Math.round(f[2] * sc), p: Math.round(f[3] * sc), c: Math.round(f[4] * sc), f: Math.round(f[5] * sc), photo: null }; });
      data.food[k] = { id: k, date: k, items }; }
  }
  return data;
}

/* ============ boot ============ */
render(true);
Store.start();
setTimeout(async () => { if (Store.mode === 'connecting') { Store.mode = 'local'; await Store.loadLocal(); changed(); await applySeed(); } }, 11000);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
